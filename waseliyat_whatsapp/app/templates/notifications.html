{% extends 'base.html' %}{% block content %}<section class="page-heading"><div><span class="eyebrow">سجل النشاط</span><h1>الإشعارات</h1></div></section><div class="card list-card">{% for n in notifications %}<div class="notice-row"><span class="soft-icon">{{ '✓' if n.level == 'success' else '!' }}</span><div><b>{{ n.title }}</b><p>{{ n.body }}</p></div><small>{{ n.created_at.strftime('%H:%M') }}</small></div>{% else %}<div class="empty-card mini"><h3>لا توجد إشعارات</h3></div>{% endfor %}</div>{% endblock %}
