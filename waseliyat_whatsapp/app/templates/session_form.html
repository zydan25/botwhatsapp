{% extends 'base.html' %}{% block content %}
<section class="narrow-page"><div class="page-heading"><div><span class="eyebrow">تخصيص الربط</span><h1>إضافة جلسة واتساب</h1><p>اسم الجلسة يحدد المسارات التي سيستخدمها الربط الخارجي.</p></div></div>
<form method="post" class="card form-card"><div class="form-section"><h3>بيانات الجلسة</h3><p>حسب الدليل: يبدأ اسم الجلسة بحرف إنجليزي، من 3 إلى 32 محرفًا.</p><label class="field"><span>اسم الجلسة</span><input name="name" required pattern="[A-Za-z][A-Za-z0-9_-]{2,31}" placeholder="basheer"></label><label class="field"><span>اسم العرض</span><input name="display_name" placeholder="جلسة المتجر الرئيسي"></label><label class="field"><span>بوابة WhatsApp API</span><input name="api_base_url" type="url" value="{{ config.WHATSAPP_API_BASE_URL }}" required></label><label class="field"><span>API الخارجي / Webhook Base URL</span><input name="webhook_base_url" type="url" placeholder="https://whats.alattab.site"></label></div><button class="btn primary large" type="submit">حفظ وإعداد الجلسة ←</button></form></section>{% endblock %}
