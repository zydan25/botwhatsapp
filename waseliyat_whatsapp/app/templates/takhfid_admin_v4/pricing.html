{% extends 'takhfid_admin_v4/base.html' %}{% block tk_content %}<section class="tk-card"><div class="tk-toolbar"><div><h2>الأسعار والتوصيل</h2><p>تعديل أسعار الصرف، هامش التسعير ورسوم التوصيل لكل محافظة. القيم تحفظ في إعدادات V4.</p></div></div><div class="tk-table-wrap"><table class="tk-table"><thead><tr><th>المحافظة</th><th>المنطقة</th><th>SAR/YER</th><th>USD/YER</th><th>الهامش</th><th>التوصيل</th><th></th></tr></thead><tbody>{% for gov, row in pricing.items() %}<tr><form method="post"><input type="hidden" name="csrf_token" value="{{ tk_csrf }}"><input type="hidden" name="governorate" value="{{ gov }}"><td><strong>{{ gov }}</strong></td><td><select class="tk-select" name="region"><option value="north" {{ 'selected' if row.get('region')=='north' else '' }}>شمال</option><option value="south" {{ 'selected' if row.get('region')=='south' else '' }}>جنوب</option></select></td><td><input class="tk-input" name="sarToYerRate" type="number" step="0.01" value="{{ row.get('sarToYerRate',0) }}"></td><td><input class="tk-input" name="usdToYerRate" type="number" step="0.01" value="{{ row.get('usdToYerRate',0) }}"></td><td><input class="tk-input" name="markupValue" type="number" step="0.01" value="{{ row.get('markupValue',0) }}"></td><td><input class="tk-input" name="deliveryFee" type="number" step="0.01" value="{{ row.get('deliveryFee',0) }}"></td><td><button class="tk-btn tk-btn-soft">حفظ</button></td></form></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
