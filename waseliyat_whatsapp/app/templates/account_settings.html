{% extends 'base.html' %}{% block content %}
<section class="narrow-page"><div class="page-heading"><div><span class="eyebrow">حسابك</span><h1>إعدادات الدخول</h1><p>يمكنك تغيير اسم المستخدم وكلمة المرور من الداخل.</p></div></div><form method="post" class="card form-card"><label class="field"><span>اسم المستخدم</span><input name="username" value="{{ current_user.username }}" required></label><label class="field"><span>كلمة المرور الحالية</span><input name="current_password" type="password" required></label><label class="field"><span>كلمة المرور الجديدة</span><input name="new_password" type="password" minlength="8" placeholder="اتركها فارغة إذا لا تريد التغيير"></label><button class="btn primary large">حفظ بيانات الدخول</button></form><div class="logout-box"><a class="btn danger" href="{{ url_for('auth.logout') }}">تسجيل الخروج من لوحة ربطيات</a></div></section>{% endblock %}
