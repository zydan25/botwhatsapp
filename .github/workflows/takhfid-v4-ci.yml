name: Takhfid V4 CI

on:
  push:
    branches: ["refactor/takhfid-store-api-v4", "feature/**"]
  pull_request:
    branches: ["refactor/takhfid-store-api-v4", "main"]

jobs:
  api-and-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waseliyat_whatsapp
    env:
      TESTING: "true"
      SECRET_KEY: ci-only-secret
      DATABASE_URL: sqlite:////tmp/takhfid-ci.db
      ADMIN_USERNAME: ciadmin
      ADMIN_PASSWORD: ci-admin-password-123
      TAKHFIID_ADMIN_PHONES: 967700000000
      TAKHFIID_OTP_HASH_SECRET: ci-only-otp-secret
      STATUS_POLL_SECONDS: "999"
      PYTHONPATH: ${{ github.workspace }}/waseliyat_whatsapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: waseliyat_whatsapp/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Run V4 tests
        run: pytest -q tests/test_takhfid_v4.py
