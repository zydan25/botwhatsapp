name: Takhfid customer server CI

on:
  workflow_dispatch:
  push:
    branches:
      - feat/takhfid-customer-server-2026-09
  pull_request:
    paths:
      - "waseliyat_whatsapp/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waseliyat_whatsapp

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile server
        run: python -m compileall -q app

      - name: Run contract tests
        run: pytest -q
