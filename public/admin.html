<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f8fb"><meta name="description" content="WhatsApp Pro Admin"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/styles.css"><title>WhatsApp Pro — الإدارة</title></head><body><div class="shell" id="adminApp"><aside class="sidebar"><div class="brand"><img src="/icons/icon.svg" class="brand-logo" alt="WA"><div><strong>WhatsApp Pro</strong><small>Admin Console</small></div></div><div class="side-actions"><button class="btn primary" data-scroll="create">+ جلسة وعميل</button><form method="post" action="/logout"><button class="btn ghost" type="submit">تسجيل الخروج</button></form></div><div class="sidebar-section"><div class="section-title">الجلسات</div><div id="sidebarSessions" class="sidebar-list"></div></div></aside><main class="main"><header class="topbar"><div><span class="eyebrow">ADMIN</span><h1>لوحة إدارة WhatsApp</h1><p>إنشاء العملاء وإدارة الجلسات ومراقبة الاتصال.</p></div><button class="btn ghost" data-action="refresh">تحديث</button></header><section class="stats-grid"><div class="stat"><span>كل الجلسات</span><strong id="kpiTotal">0</strong></div><div class="stat"><span>متصلة</span><strong id="kpiConnected">0</strong></div><div class="stat"><span>بانتظار QR</span><strong id="kpiQr">0</strong></div><div class="stat"><span>أخطاء</span><strong id="kpiErrors">0</strong></div></section><section class="panel" id="create"><div class="panel-head"><div><span class="eyebrow">CREATE</span><h2>جلسة جديدة + حساب عميل</h2></div></div><div class="form-grid four"><label>اسم الجلسة<input id="createName" maxlength="32" placeholder="client1"></label><label>اسم العميل<input id="createDisplayName" maxlength="100" placeholder="العميل الأول"></label><label>اسم المستخدم<input id="createUsername" maxlength="32" placeholder="client1"></label><label>كلمة المرور<input id="createPassword" type="password" minlength="10" placeholder="10 أحرف على الأقل"></label><label class="wide">وصف الجلسة<textarea id="createDescription" maxlength="1000" rows="3" placeholder="وصف كامل للجلسة والخدمة"></textarea></label><label class="wide">رابط API للاستقبال<input id="createApiUrl" placeholder="http://api.example.com"></label><label>رقم احتياطي<input id="createBackupPhone" placeholder="9677xxxxxxx"></label><label>تشغيل تلقائي<select id="createAutoStart"><option value="true">نعم</option><option value="false">لا</option></select></label></div><div class="row"><span class="hint">لا يتم حفظ أي صورة أو ملف مرفوع إلى القرص.</span><button class="btn primary" data-action="submit-create">إنشاء الجلسة</button></div></section><section class="panel"><div class="panel-head"><div><span class="eyebrow">SESSIONS</span><h2>كل الجلسات</h2></div></div><div id="sessionGrid" class="session-grid"></div></section></main></div><script src="/socket.io/socket.io.js"></script><script src="/static/admin.js"></script></body></html>
