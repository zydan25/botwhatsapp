<!DOCTYPE html>
<html>
<head>
  <title>Session</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<h2 id="title"></h2>

<div id="status"></div>

<canvas id="qr"></canvas>

<input id="number" placeholder="رقم">
<input id="message" placeholder="رسالة">
<button onclick="send()">إرسال</button>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
const session = location.pathname.replace('/','');

document.getElementById('title').innerText = session;

function load(){
  fetch(`/${session}/status`)
  .then(r=>r.json())
  .then(data=>{
    document.getElementById('status').innerText = data.status;
  });

  fetch(`/${session}/qr`)
  .then(r=>r.json())
  .then(data=>{
    if(data.qr){
      QRCode.toCanvas(document.getElementById("qr"), data.qr);
    }
  });
}

function send(){
  fetch(`/${session}/send`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      number: document.getElementById('number').value,
      message: document.getElementById('message').value
    })
  });
}

setInterval(load, 3000);
load();
</script>
</body>
</html>
